name: Deploy to Oracle Server

on:
  push:
    branches: [ main ]

# Un solo deploy alla volta: se arrivano più push ravvicinati i run restano in
# coda invece di partire insieme (era la causa dei conflitti sui nomi dei
# container). cancel-in-progress resta false per non interrompere un deploy
# a metà.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# Prerequisiti sul server Oracle:
#   - secret GitHub `SSH_PRIVATE_KEY` (chiave privata dell'utente `ubuntu`)
#   - repo clonato in /var/www/NEOTETRIS (branch main, con `origin` corretto)
#   - rete Docker esterna `npm_default` (Nginx Proxy Manager vi è collegato)
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 158.180.235.83
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # La build può richiedere qualche minuto (npm ci + Vite + immagine).
          command_timeout: 20m
          script: |
            set -e
            cd /var/www/NEOTETRIS
            git pull origin main

            # Rimuove eventuali container rimasti in stato "Created" da un
            # deploy interrotto: occupano il nome e fanno fallire `up`.
            docker ps -a \
              --filter "status=created" \
              --filter "name=neo-tetris" \
              --format '{{.ID}}' | xargs -r docker rm -f

            docker compose up --build -d --remove-orphans
            echo "✅ Deploy completato"
